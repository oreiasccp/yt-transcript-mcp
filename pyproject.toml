[project]
name = "yt-transcript-mcp"
version = "0.1.0"
description = "Local MCP server for YouTube transcripts (native captions first, faster-whisper fallback) + search/channel/playlist tools. Runs from your residential IP alongside Claude Code."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "yt-dlp>=2025.11.0",
    "faster-whisper>=1.1.0",
    "defusedxml>=0.7.1",
    # CUDA runtime libs for faster-whisper on NVIDIA GPUs (CTranslate2 needs cuBLAS + cuDNN 9).
    # Pulled automatically on install; harmless on CPU-only machines.
    "nvidia-cublas-cu12; platform_system != 'Darwin'",
    "nvidia-cudnn-cu12>=9.0.0; platform_system != 'Darwin'",
]

[project.scripts]
yt-transcript-mcp = "yt_transcript_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_transcript_mcp"]
